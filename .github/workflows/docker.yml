name: docker

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

jobs:
  smoke:
    name: Image boot smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t hokeypokey:smoke .

      - name: Write minimal config
        run: |
          cat > smoke.toml <<'EOF'
          [server]
          host = "0.0.0.0"
          port = 11371
          EOF

      - name: Boot container and probe /healthz
        run: |
          docker run -d --name smoke \
            -p 11371:11371 \
            -v "$PWD/smoke.toml:/etc/hokeypokey/hokeypokey.toml:ro" \
            hokeypokey:smoke
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:11371/healthz; then
              echo "healthz OK"
              exit 0
            fi
            sleep 2
          done
          echo "::error::container never became healthy"
          docker logs smoke
          exit 1

      - name: Container logs (on failure)
        if: failure()
        run: docker logs smoke || true
