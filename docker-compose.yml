services:
  hokeypokey:
    image: ghcr.io/tholent/hokeypokey:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    # No ports exposed directly — Caddy proxies all external traffic.
    volumes:
      # Mount your configuration file (read-only)
      - ./hokeypokey.toml:/etc/hokeypokey/hokeypokey.toml:ro
    env_file:
      - path: .env
        required: false
    environment:
      # Credentials passed via environment variables, never in the config file.
      # Define them in a .env file (see .env.example) or export them in your shell.
      - LDAP_BIND_PASSWORD
      - GITHUB_TOKEN
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:11371/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    # Optional: override host/port without editing the config file
    # command: ["--config", "/etc/hokeypokey/hokeypokey.toml", "--port", "11371"]

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"       # ACME HTTP-01 challenge
      - "11371:11371" # HKP (plain)
      - "11372:11372" # HKPS (TLS, Let's Encrypt)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    env_file:
      - path: .env
        required: false
    environment:
      - HKPS_DOMAIN
    depends_on:
      - hokeypokey
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
